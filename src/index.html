<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montre de concentration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap">
  <link rel="stylesheet" href="css/watch.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>

<div id="watch">
  <!-- Repère : viewBox 1000 × 1000, celui de l'illustration de référence -->
  <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="Montre de concentration">
    <defs>
      <clipPath id="subClip"><circle r="43"/></clipPath>
      <radialGradient id="goldRing" cx="35%" cy="30%" r="80%">
        <stop offset="0" stop-color="#f3d98b"/>
        <stop offset=".55" stop-color="#d4a94f"/>
        <stop offset="1" stop-color="#9c7428"/>
      </radialGradient>
      <!-- Image choisie par l'utilisateur pour la petite fenêtre -->
      <pattern id="userBg" patternUnits="objectBoundingBox" width="1" height="1">
        <image id="userBgImg" x="0" y="0" width="86" height="86" preserveAspectRatio="xMidYMid slice"/>
      </pattern>
    </defs>

    <!-- Boîtier, anneau, couronne et plantes : illustration détourée (fond transparent).
         Dans l'appli, on la tient pour déplacer la montre. -->
    <image id="case" href="assets/montre_base.png" x="0" y="0" width="1000" height="1000"/>

    <!-- Paupières de la boule de suie, posées sur ses yeux -->
    <ellipse class="lid" cx="587.5" cy="832" rx="9" ry="10" fill="#141414"/>
    <ellipse class="lid" cx="611.5" cy="833.5" rx="9" ry="10" fill="#141414"/>

    <!-- Cadran redessiné par-dessus celui de l'illustration ; origine au centre -->
    <g id="dial" transform="translate(503 596.5)">
      <circle r="211" fill="#f9f0d3" stroke="#3b2c14" stroke-width="2"/>
      <path id="arc" fill="none" stroke="#9cc98a" stroke-opacity=".8" stroke-width="30" d=""/>
      <path id="arcEdge" fill="none" stroke="#6fa35a" stroke-opacity=".55" stroke-width="2" d=""/>
      <g id="dots"></g>      <!-- rempli par buildDial() -->
      <g id="numerals"></g>  <!-- rempli par buildDial() -->

      <!-- Petite fenêtre : météo en direct (ou image choisie) -->
      <g id="sub" transform="translate(0 110)">
        <circle r="52" fill="url(#goldRing)" stroke="#5b3f12" stroke-width="2.5"/>
        <g clip-path="url(#subClip)">
          <rect id="sky" x="-50" y="-50" width="100" height="100" fill="#8fc8ee"/>
          <g id="wIcon" transform="translate(0 -3)"></g>
          <rect id="userScene" x="-43" y="-43" width="86" height="86" fill="url(#userBg)" opacity="0"/>
          <rect id="wFlash" x="-50" y="-50" width="100" height="100" fill="#fffbe0" opacity="0"/>
        </g>
        <circle r="43" fill="none" stroke="#5b3f12" stroke-width="1.5"/>
      </g>

      <text id="readout" x="0" y="50" text-anchor="middle" font-size="40" fill="#3b2c14"></text>
      <text id="paused" x="0" y="-62" text-anchor="middle" font-size="22" fill="#8a7a5a" letter-spacing="2">en pause</text>

      <!-- Aiguilles : temps restant (mode concentration) ou heure réelle (mode montre) -->
      <path id="hourHand" d="M -5 14 L -3.5 -52 Q -14 -68 0 -96 Q 14 -68 3.5 -52 L 5 14 Z"
            fill="#2c4270" stroke="#141d33" stroke-width="2"/>
      <path id="minuteHand" d="M -3.5 16 L -2.5 -118 Q -10 -132 0 -152 Q 10 -132 2.5 -118 L 3.5 16 Z"
            fill="#2c4270" stroke="#141d33" stroke-width="2"/>
      <circle r="12" fill="#2c4270" stroke="#141d33" stroke-width="2"/>

      <!-- Trotteuse : secondes réelles, en continu -->
      <g id="secondHand" pointer-events="none">
        <line x1="0" y1="38" x2="0" y2="-186" stroke="#8c3b2a" stroke-width="2.4" stroke-linecap="round"/>
        <circle cy="30" r="7" fill="none" stroke="#8c3b2a" stroke-width="2.4"/>
        <circle r="6" fill="#8c3b2a"/>
      </g>
      <circle r="3" fill="#e9c98a" pointer-events="none"/>

      <!-- Zones cliquables (transparentes), au-dessus de tout le reste -->
      <circle id="dialHit" r="211" fill="transparent"/>
      <g id="hourHit" class="handHit">
        <line x1="0" y1="0" x2="0" y2="-100" stroke="transparent" stroke-width="34" stroke-linecap="round"/>
      </g>
      <g id="minuteHit" class="handHit">
        <line x1="0" y1="-60" x2="0" y2="-158" stroke="transparent" stroke-width="30" stroke-linecap="round"/>
      </g>

      <!-- Bouton musique : lancer / arrêter (au-dessus des aiguilles pour rester cliquable) -->
      <g id="musicBtn" transform="translate(-88 0)" role="button" aria-label="Musique">
        <title>Musique : lancer / arrêter</title>
        <circle r="26" fill="url(#goldRing)" stroke="#5b3f12" stroke-width="2"/>
        <circle r="20" fill="#f9f0d3" stroke="#5b3f12" stroke-width="1.2"/>
        <g class="note" transform="scale(1.35)">
          <ellipse cx="-5" cy="6" rx="3.6" ry="2.6" transform="rotate(-20 -5 6)"/>
          <ellipse cx="5" cy="3.5" rx="3.6" ry="2.6" transform="rotate(-20 5 3.5)"/>
          <path d="M -1.8 5 V -7 L 8.4 -9.5 V 3" fill="none" stroke-width="1.5"/>
          <path d="M -1.8 -7 L 8.4 -9.5 V -6.6 L -1.8 -4.1 Z"/>
        </g>
      </g>
    </g>

    <!-- Couronne : zone de réglage et son halo (le halo doit suivre directement la zone, voir CSS) -->
    <circle id="crownHit" cx="500" cy="195" r="58" fill="transparent"/>
    <circle id="crownGlow" cx="500" cy="195" r="62" fill="none" stroke="#fff6c8" stroke-width="5"
            stroke-dasharray="14 10" pointer-events="none"/>
  </svg>
</div>

<!-- Menu du clic droit, rempli à l'ouverture -->
<div id="menu" role="menu"></div>

<!-- Petite fenêtre de saisie (durée personnalisée, ville) -->
<form id="ask" autocomplete="off" style="display: none">
  <label id="askTitle" for="askInput"></label>
  <input id="askInput" type="text">
  <div id="askMsg" role="alert"></div>
  <div class="row">
    <button type="button" id="askCancel">Annuler</button>
    <button type="submit">OK</button>
  </div>
</form>

<input id="filePick" type="file" accept="image/*" hidden>
<input id="musicPick" type="file" accept="audio/*,video/*" hidden>

<!-- Aide de l'aperçu navigateur (absente de l'appli) -->
<div id="hint"></div>

</body>
</html>
